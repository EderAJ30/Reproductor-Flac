version: "3.8"

services:
  api:
    build: ./backend
    container_name: flac_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./volumes/db:/app/db
      - /Volumes:/Volumes:ro # <--- MAGIA: Lee cualquier USB sin romperse si lo desconectas
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: flac_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
